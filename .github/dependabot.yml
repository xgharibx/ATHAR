# Keeps dependencies and build actions current, with security fixes first.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades of the app framework and build chain are planned
      # migrations, not routine updates: each needs code changes and testing.
      - dependency-name: "@capacitor/*"
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: tailwindcss
        update-types: [version-update:semver-major]
      - dependency-name: tailwind-merge
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]
      - dependency-name: "@vitejs/plugin-react"
        update-types: [version-update:semver-major]
      - dependency-name: vite-plugin-pwa
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      # Pre-1.0 packages break on "minor" releases. The 3D stack moves together.
      - dependency-name: three
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: "@react-three/*"
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: eslint-plugin-react-refresh
        update-types: [version-update:semver-major, version-update:semver-minor]
      # Lint rule sets: a new major adds rules that need code changes.
      - dependency-name: eslint-plugin-react-hooks
        update-types: [version-update:semver-major]
      # Node type definitions follow the Node.js version the builds run on (26).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      # The lint parser (typescript-eslint) supports TypeScript below 6.1.
      # Take newer compilers once it does.
      - dependency-name: typescript
        versions: [">=6.1.0"]
      # Published without the signed provenance earlier releases carry. Take a
      # later release once it is signed again.
      - dependency-name: "@tsparticles/*"
        versions: ["4.6.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: bundler
    directory: /ios
    schedule:
      interval: monthly
