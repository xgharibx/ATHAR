name: Feature request
description: Suggest an improvement to Athar.
labels: [enhancement]
body:
  - type: textarea
    id: need
    attributes:
      label: What do you need to do?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested solution
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options: [Web, Android, iOS, Huawei]
