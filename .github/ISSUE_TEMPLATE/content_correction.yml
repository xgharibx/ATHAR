name: Content correction
description: A verse, hadith, dhikr, translation or attribution is wrong.
labels: [content]
body:
  - type: input
    id: location
    attributes:
      label: Where in the app
      placeholder: "Morning adhkar, item 4"
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Current text
    validations:
      required: true
  - type: textarea
    id: correct
    attributes:
      label: Correct text
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Source
      description: The book, edition and number, or a link to a recognised reference.
    validations:
      required: true
