# Keep the update prompt honest.
#
# `released.android` in package.json is what Google Play is actually serving,
# and it is what the app compares itself against before telling anyone to
# update. It moves when a release finishes rolling out — not when a commit is
# pushed — so nothing in the normal build can know it.
#
# This asks the Play listing once a day and commits the change if there is one.
# Committing to main triggers the pages deploy, which republishes version.json,
# which is where the app reads it from.
#
# The script leaves the value alone on any doubt, so a bad day here means a
# late prompt rather than a wrong one.
name: Sync store version

on:
  schedule:
    # Every six hours, off the hour to avoid the top-of-hour Actions crush.
    # A release reaches people within hours of going live on Play rather than
    # up to a day; the job is one HTTPS request, so the cost is nil.
    - cron: "20 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  # Needed to start the pages deploy below. A push made with GITHUB_TOKEN does
  # NOT trigger other workflows, so deploy-pages would never see this commit and
  # the site would keep serving the old version.json — the update prompt would
  # sit there doing nothing, with no error anywhere to say why.
  actions: write

concurrency:
  group: sync-store-version
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Read the Play listing
        run: node tools/scripts/sync-store-version.mjs --write

      - name: Commit if it moved
        id: commit
        run: |
          if git diff --quiet -- package.json; then
            echo "no change"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "Play is now serving $(node -p "require('./package.json').released.android")"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # The commit above cannot trigger the deploy on its own, so ask for it.
      # Only when something actually changed — a redeploy of identical content
      # every six hours is noise.
      - name: Publish the new version to the site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-pages.yml --ref main
