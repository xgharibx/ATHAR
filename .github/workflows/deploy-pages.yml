name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # Accounts hide themselves when unconfigured (see isAuthConfigured), so a
      # missing key deploys a site with no sign-in and no error — the failure
      # mode is silence. Warn loudly rather than fail: a key that lapses should
      # not also take down every unrelated deploy.
      - name: Check accounts config
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "::warning title=Accounts disabled::VITE_SUPABASE_ANON_KEY is not set, so sign-in and cloud sync will be hidden on the deployed site. Add it under Settings → Secrets and variables → Actions."
          fi

      - name: Build (GitHub Pages)
        env:
          GITHUB_PAGES: "true"
          VITE_LEADERBOARD_ENDPOINT: ${{ secrets.VITE_LEADERBOARD_ENDPOINT }}
          VITE_LEADERBOARD_ANON_KEY: ${{ secrets.VITE_LEADERBOARD_ANON_KEY }}
          VITE_COMPANION_API_KEY: ${{ secrets.VITE_COMPANION_API_KEY }}
          VITE_COMPANION_PROXY_URL: ${{ secrets.VITE_COMPANION_PROXY_URL }}
          # The project URL is not sensitive and is already public in
          # docs/ACCOUNTS_SETUP.md, so it defaults here and only the key needs
          # to be configured. Set the secret to point a fork at another project.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ojstudhmcypoqfnwugbf.supabase.co' }}
          # Publishable/anon key. Safe in a client bundle by design — row-level
          # security, not key secrecy, is what protects user data. It lives in a
          # secret anyway because this repo is public and committing it should
          # be a deliberate choice, not a side effect of a workflow edit.
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ICON_REV: ${{ github.sha }}
          VITE_RUNTIME_VERSION: ${{ github.sha }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
