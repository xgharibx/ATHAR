name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: npm

      - name: Install
        run: npm ci

      # Accounts hide themselves when unconfigured (see isAuthConfigured), so a
      # missing key deploys a site with no sign-in and no error — the failure
      # mode is silence. Warn loudly rather than fail: a key that lapses should
      # not also take down every unrelated deploy.
      - name: Check accounts config
        run: |
          if [ -z "${{ secrets.VITE_SUPABASE_ANON_KEY }}" ]; then
            echo "::warning title=Accounts disabled::VITE_SUPABASE_ANON_KEY is not set, so sign-in and cloud sync will be hidden on the deployed site. Add it under Settings → Secrets and variables → Actions."
          fi

      - name: Verify and build (GitHub Pages)
        env:
          GITHUB_PAGES: "true"
          VITE_LEADERBOARD_ENDPOINT: ${{ secrets.VITE_LEADERBOARD_ENDPOINT }}
          VITE_LEADERBOARD_ANON_KEY: ${{ secrets.VITE_LEADERBOARD_ANON_KEY }}
          VITE_COMPANION_PROXY_URL: ${{ secrets.VITE_COMPANION_PROXY_URL }}
          # The project URL is not sensitive (it ships in every client build),
          # so it defaults here and only the key needs to be configured.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://ojstudhmcypoqfnwugbf.supabase.co' }}
          # Publishable/anon key. Safe in a client bundle by design — row-level
          # security, not key secrecy, is what protects user data. It lives in a
          # secret so that rotating it does not require a code change.
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_ICON_REV: ${{ github.sha }}
          VITE_RUNTIME_VERSION: ${{ github.sha }}
        run: npm run verify

      # Shared hadith links (www.athark.org/hadith/…) open the app when it is
      # installed: iOS universal links need the team's app id, Android app
      # links the fingerprint of the Play signing certificate (Play Console →
      # App integrity). Each file is written only when its value is set.
      - name: Write app link files
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ANDROID_CERT_SHA256: ${{ secrets.ANDROID_CERT_SHA256 || vars.ANDROID_CERT_SHA256 }}
        run: node tools/scripts/app-links.mjs dist

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: dist
          # Publishes /.well-known/security.txt.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
