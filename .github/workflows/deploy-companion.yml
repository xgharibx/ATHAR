name: Deploy AI server

# Publishes the «اسأل أثر» server (supabase/functions/companion) whenever it
# changes on main, so server fixes reach every installed app without a manual
# step. It does nothing until a Supabase access token is saved as the
# repository secret SUPABASE_ACCESS_TOKEN (Supabase dashboard → Account →
# Access Tokens). The model key stays a Supabase secret and never passes
# through here.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/companion/**"
      - "supabase/config.toml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-companion
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy companion function
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'ojstudhmcypoqfnwugbf' }}
    steps:
      - name: Check for the access token
        id: token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning title=AI server not deployed::Add SUPABASE_ACCESS_TOKEN under Settings → Secrets and variables → Actions to publish the companion function automatically."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26

      - name: Deploy
        if: steps.token.outputs.present == 'true'
        run: npx --yes supabase@2.122.1 functions deploy companion --project-ref "$PROJECT_REF" --use-api
