name: iOS store listing

# Pushes the active Arabic metadata and screenshots from ios/fastlane/release/ to App Store Connect.
# Run it after the app record exists in App Store Connect. Does not upload a build and
# does not submit for review. Needs the same App Store Connect API key secrets as iOS Build.
on:
  push:
    branches: [main]
    paths:
      - "ios/fastlane/release/**"
      - "ios/fastlane/Fastfile"
      - ".github/workflows/ios-metadata.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Write App Store Connect API key
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$APPSTORE_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey_${APPSTORE_KEY_ID}.p8"

      - name: Install fastlane
        working-directory: ios
        run: bundle install

      - name: Upload listing
        working-directory: ios
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          export APPSTORE_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_${APPSTORE_KEY_ID}.p8"
          bundle exec fastlane metadata
