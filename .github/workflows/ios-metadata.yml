name: iOS store listing

# Pushes ios/fastlane/metadata (text) and ios/fastlane/screenshots to App Store Connect.
# Run it after the app record exists in App Store Connect. Does not upload a build and
# does not submit for review. Needs the same App Store Connect API key secrets as iOS Build.
on:
  workflow_dispatch:

jobs:
  metadata:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Write App Store Connect API key
        env:
          APPSTORE_PRIVATE_KEY: ${{ secrets.APPSTORE_PRIVATE_KEY }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          echo "$APPSTORE_PRIVATE_KEY" > "$RUNNER_TEMP/asc/AuthKey_${APPSTORE_KEY_ID}.p8"

      - name: Install fastlane
        working-directory: ios
        run: bundle install

      - name: Upload listing
        working-directory: ios
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          export APPSTORE_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_${APPSTORE_KEY_ID}.p8"
          bundle exec fastlane metadata
