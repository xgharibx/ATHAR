name: Android validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: macos-26
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies and build web assets
        run: |
          npm ci
          npm run build

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build, lint, and run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: arm64-v8a
          profile: pixel_2
          disable-animations: true
          script: |
            cd android
            ./gradlew --no-daemon :app:assembleDebug :app:lintDebug connectedDebugAndroidTest
