apply plugin: 'com.android.application'

// Athar on Wear OS: the tasbeeh on the wrist, and the next prayer from the
// phone. Same application id as the phone app, so the two can talk through
// the Wearable Data Layer (WearSync on the phone).
android {
    namespace = "com.athar.adhkar.wear"
    compileSdk = 36
    defaultConfig {
        applicationId "com.athar.adhkar"
        minSdkVersion 30
        targetSdkVersion 36
        // Kept apart from the phone app's codes, as Google Play requires.
        versionCode 900001
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "com.google.android.gms:play-services-wearable:18.2.0"
    // The next prayer as a tile and a watch-face complication.
    implementation "androidx.wear.tiles:tiles:1.4.1"
    implementation "androidx.wear.protolayout:protolayout:1.2.1"
    implementation "androidx.wear.watchface:watchface-complications-data-source:1.2.1"
    implementation "androidx.concurrent:concurrent-futures:1.2.0"
}
